<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirection en cours...</title>
</head>
<body>
    <p>Recherche du commerce en cours...</p>

    <script>
        const urlBaseDeDonnees = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSblQHu62cGpGf_U39E0AFcYVGA17N0gcv4kyBbTdyOlLnQBbjpt_ig_0u4zpqdwWmdVMoGFk_DSOW4/pub?gid=0&single=true&output=tsv";

        const urlParams = new URLSearchParams(window.location.search);
        const carteId = urlParams.get('c');

        if (carteId) {
            fetch(urlBaseDeDonnees + "&t=" + new Date().getTime())
                .then(response => response.text())
                .then(texte => {
                    const lignes = texte.split(/\r?\n/);
                    let lienFinal = "";

                    for (let i = 0; i < lignes.length; i++) {
                        if (!lignes[i].trim()) continue;
                        const colonnes = lignes[i].split('\t');
                        const idLigne = colonnes[0] ? colonnes[0].trim() : "";

                        // Si on trouve la ligne de la carte recherchée
                        if (idLigne === carteId.trim()) {
                            // On cherche le lien HTTP dans n'importe laquelle des dernières colonnes de la ligne
                            for (let j = colonnes.length - 1; j >= 0; j--) {
                                if (colonnes[j] && colonnes[j].trim().startsWith("http")) {
                                    lienFinal = colonnes[j].trim();
                                    break;
                                }
                            }
                            break;
                        }
                    }

                    if (lienFinal) {
                        window.location.replace(lienFinal);
                    } else {
                        document.body.innerHTML = "<h1>Erreur : La carte " + carteId + " existe mais aucun lien valide n'a été trouvé dans la ligne.</h1>";
                    }
                })
                .catch(erreur => {
                    document.body.innerHTML = "<h1>Erreur de connexion au tableur.</h1>";
                });
        } else {
            document.body.innerHTML = "<h1>Erreur : Aucune carte spécifiée.</h1>";
        }
    </script>
</body>
</html>
