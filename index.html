<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Redirection en cours...</title>
</head>
<body>
    <p>Recherche du commerce en cours...</p>

    <script>
        // Ton nouveau lien Google Sheet au format TSV
        const urlBaseDeDonnees = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRr0ngpLN1TuzV2hDMMnykuV7HKzNcR87hwdpYWmC36DTcbnRTIqHI4DDcOC0kKNVRqU4JJf2vY8YGp/pub?gid=0&single=true&output=tsv";

        const urlParams = new URLSearchParams(window.location.search);
        const carteId = urlParams.get('c');

        if (carteId) {
            fetch(urlBaseDeDonnees + "&t=" + new Date().getTime())
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Problème de connexion");
                    }
                    return response.text();
                })
                .then(texte => {
                    const lignes = texte.split(/\r?\n/);
                    let lienFinal = "";

                    // On commence à i = 1 pour ignorer la ligne d'en-tête du tableau
                    for (let i = 1; i < lignes.length; i++) {
                        if (!lignes[i].trim()) continue;
                        
                        const colonnes = lignes[i].split('\t');
                        const idLigne = colonnes[0] ? colonnes[0].trim() : "";

                        // Comparaison de l'ID de carte
                        if (idLigne === carteId.trim()) {
                            // Extraction du lien HTTP/HTTPS
                            for (let j = colonnes.length - 1; j >= 0; j--) {
                                const valeur = colonnes[j] ? colonnes[j].trim() : "";
                                if (valeur.startsWith("http://") || valeur.startsWith("https://")) {
                                    lienFinal = valeur;
                                    break;
                                }
                            }
                            break;
                        }
                    }

                    if (lienFinal) {
                        window.location.replace(lienFinal);
                    } else {
                        document.body.innerHTML = "<h1>Erreur : La carte " + carteId + " existe mais aucun lien valide n'a été trouvé.</h1>";
                    }
                })
                .catch(erreur => {
                    console.error(erreur);
                    document.body.innerHTML = "<h1>Erreur de connexion au tableur.</h1>";
                });
        } else {
            document.body.innerHTML = "<h1>Erreur : Aucune carte spécifiée.</h1>";
        }
    </script>
</body>
</html>
